name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  validate:
    name: Import and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Download Godot
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Run smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd

      - name: Run the main scene
        run: godot --headless --path . --quit-after 600

      - name: Exercise the 11v11 simulation
        run: godot --headless --path . res://gameplay/match/match.tscn --quit-after 1800
